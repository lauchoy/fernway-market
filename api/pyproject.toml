[project]
name = "fernway"
version = "0.1.0"
description = "Fernway Market payouts console API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fernway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FLY"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["fernway"]

[tool.importlinter]
root_package = "fernway"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["fernway.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "starlette", "alembic", "fernway.routes", "fernway.services", "fernway.repositories"]
